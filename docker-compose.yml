version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  nop-db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: nop-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    restart: no
    networks:
      - app-network

  nop-web:
    image: nopcommerceteam/nopcommerce:4.90.3
    container_name: nop-web
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
    working_dir: /app
    restart: no
    networks:
      - app-network
    depends_on:
      - nop-db
